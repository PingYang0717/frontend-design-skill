# Azure DevOps Pipelines:PR 與主分支的品質關卡。四項全綠 + API 契約表與程式碼一致才能合併(在分支原則設定 Build validation 指向這條 pipeline)。
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm

steps:
  - task: NodeTool@0
    displayName: 'Use Node.js'
    inputs:
      versionSpec: '24.22.x'

  - task: Cache@2
    displayName: 'Cache npm'
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)

  # CI 用 npm ci:只依 lockfile 安裝,與 package.json 不一致就失敗(本機用 npm install,見 ADR-0016)。
  - script: npm ci
    displayName: 'Install dependencies'
    env:
      HUSKY: '0'

  - script: npm run lint
    displayName: 'Lint'

  - script: npm run typecheck
    displayName: 'Typecheck'

  - script: npm test
    displayName: 'Test'

  - script: npm run build
    displayName: 'Build'

  # docs/api-contract.md 由程式碼產生;改了端點或 DTO 沒重跑 npm run api-contract 就擋下(docs/conventions/api.md 第 7 節)。
  - script: npm run api-contract:check
    displayName: 'API contract up to date'
